name: Test

on:
  push:
    branches:
      - 'dev*'
    paths:
      - .github/actions/**
      - .github/workflows/test.yml
      - androidApp/**
      - buildScript/**
      - buildSrc/**
      - composeApp/**
      - gradle/**
      - gradle.properties
      - library/**
      - Makefile
      - run
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/test.yml
      - androidApp/**
      - buildScript/**
      - buildSrc/**
      - composeApp/**
      - gradle/**
      - gradle.properties
      - library/**
      - Makefile
      - run

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          # -x follows the `# shellcheck source=` directives into sourced files.
          shellcheck -x run
          find buildScript -name '*.sh' -exec shellcheck -x {} +
