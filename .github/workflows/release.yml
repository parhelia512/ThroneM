name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      no-publish:
        description: Build artifacts without publishing a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SINGBOX_VERSION: '1.14.1-lx.8'

jobs:
  android:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Download libbox AAR
        run: |
          mkdir -p composeApp/libs
          curl -fL --retry 3 -o composeApp/libs/libbox.aar \
            "https://github.com/Leadaxe/sing-box-lx/releases/download/v${SINGBOX_VERSION}/libbox-${SINGBOX_VERSION}.aar"
      - uses: ./.github/actions/load-build-versions
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ./.github/actions/gradle-cache
        with:
          read-only: 'true'
          build-cache-name: release-android
      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: assets-v3-${{ hashFiles('buildScript/lib/assets.sh') }}
      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets
      - name: Write signing properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: printf '%s' "$LOCAL_PROPERTIES" > local.properties
      - name: Generate about libraries metadata
        run: make aboutlibraries_android
      - name: Build Android app
        run: make apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: mapping-android
          path: androidApp/build/outputs/mapping/fossRelease/mapping.txt
          if-no-files-found: error
          compression-level: 9

  publish:
    needs: [android]
    if: ${{ !inputs.no-publish }}
    runs-on: ubuntu-26.04
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: android
          path: release-artifacts
      - name: Download R8 mappings
        uses: actions/download-artifact@v8
        with:
          pattern: mapping-*
          path: mapping
      - name: Bundle R8 mappings
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd mapping
          zip -9 -r -q "$GITHUB_WORKSPACE/release-artifacts/mapping-$RELEASE_TAG.zip" .
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --generate-notes --prerelease
          fi
