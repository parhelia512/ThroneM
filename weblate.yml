# Hosted Weblate: https://hosted.weblate.org/projects/thronem/
# One component per strings.xml tree. A filemask may contain only one "*"
# (the language code). Linked components share the Git checkout of `thronem`.

component:
  name: thronem
  slug: thronem
  project: thronem
  filemask: composeApp/src/commonMain/composeResources/values-*/strings.xml
  template: composeApp/src/commonMain/composeResources/values/strings.xml
  file_format: cmp-resource

components:
  - name: Android
    slug: android
    project: thronem
    repo: weblate://thronem/thronem
    filemask: composeApp/src/androidMain/composeResources/values-*/strings.xml
    template: composeApp/src/androidMain/composeResources/values/strings.xml
    file_format: cmp-resource
  - name: Android system
    slug: android-system
    project: thronem
    repo: weblate://thronem/thronem
    filemask: composeApp/src/androidMain/res/values-*/strings.xml
    template: composeApp/src/androidMain/res/values/strings.xml
    file_format: aresource
